name: MISDESC Full-Stack & DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-backend:
    name: Backend Lint, Schema & Health Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: MISDESC
          POSTGRES_PASSWORD: MISDESC_password
          POSTGRES_DB: MISDESC_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Validate Backend JavaScript Syntax
        working-directory: ./backend
        run: |
          find src prisma -name "*.js" -exec node -c {} +

      - name: Generate Prisma Client & Push Schema
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://MISDESC:MISDESC_password@localhost:5432/MISDESC_system?schema=public"
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run Database Seeding Test
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://MISDESC:MISDESC_password@localhost:5432/MISDESC_system?schema=public"
        run: node prisma/seed.js

      - name: Run Core Features Unit Diagnostic (84-Test Suite)
        working-directory: ./backend
        run: npm test

      - name: Run Sovereign 6 Pillars Verification Suite ($1T-$50T FinTech)
        working-directory: ./backend
        run: node scripts/verify-sovereign-pillars.js

      - name: Run RBI & DPI Sovereign Stack Verification (MuleHunter, Hourly T+0, NeSL, ULI, Bhashini, SRVA)
        working-directory: ./backend
        run: node scripts/verify-dpi-sovereign-stack.js

      - name: Execute Standalone DB Health Diagnostic
        env:
          DATABASE_URL: "postgresql://MISDESC:MISDESC_password@localhost:5432/MISDESC_system?schema=public"
        run: node scripts/db-health.js

      - name: Verify Multi-Role RBAC & SRE Health Diagnostic
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://MISDESC:MISDESC_password@localhost:5432/MISDESC_system?schema=public"
          JWT_SECRET: "ci_secret_test_key_12345678901234567890"
          PORT: 5000
        run: |
          node src/server.js &
          sleep 4
          node scripts/verify-roles.js

  validate-infrastructure:
    name: K8s Manifests & Monitoring Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Grafana Dashboard JSON Syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('monitoring/grafana/dashboards/MISDESC_national_clearing_dashboard.json')); console.log('✓ Grafana Dashboard JSON is valid');"

      - name: Validate Kubernetes Manifests Syntax
        run: |
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('k8s').filter(f => f.endsWith('.yaml') || f.endsWith('.yml'));
            files.forEach(f => {
              const content = fs.readFileSync('k8s/' + f, 'utf8');
              if (!content.trim()) throw new Error('Empty file: ' + f);
              console.log('✓ Validated k8s/' + f);
            });
          "

  validate-frontend:
    name: Frontend Build & Bundle Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Production Vite Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Verify Distribution Artifacts
        working-directory: ./frontend
        run: |
          test -f dist/index.html || exit 1
          echo "Vite distribution build verified successfully."

  security-scan:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend Security Audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Frontend Security Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  docker-compose-validation:
    name: Multi-Container Docker Build Check
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend, validate-infrastructure]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Stack Images
        run: docker compose build
