global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "MISDESC-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000"]
        labels:
          application: "MISDESC-system"
          environment: "production"
          region: "in-west-1"
          grid: "national-clearing-grid"
